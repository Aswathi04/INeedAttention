<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Genie Lamp</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <h1>Genie Lamp — Phase 2 (personalities + memory)</h1>

  <video id="camera" autoplay playsinline muted></video>
  <br />
  <button id="captureBtn">Point &amp; Ask</button>

  <p id="currentObject"></p>
  <div id="conversationLog"></div>

  <form id="replyForm">
    <input id="replyInput" type="text" placeholder="Type your reply..." autocomplete="off" />
    <button type="submit">Send</button>
  </form>

  <script type="module" src="app.js"></script>
</body>
</html>
